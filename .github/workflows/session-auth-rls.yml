name: Session authenticated RLS proof

on:
  workflow_dispatch:
  push:
    branches:
      - phase1-foundation-bootstrap
    paths:
      - 'app/sessions.py'
      - 'tests/api/session_auth_rls_proof.py'
      - '.github/workflows/session-auth-rls.yml'
      - 'migrations/0011_*.sql'
      - 'migrations/0009_*.sql'
      - 'migrations/0010_*.sql'
      - 'migrations/0012_*.sql'
      - 'migrations/0013_*.sql'
      - 'migrations/0014_*.sql'

jobs:
  auth-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: proof
          POSTGRES_USER: proof
          POSTGRES_DB: faos_proof
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-foundation-bootstrap
      - name: Install client and Python
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install fastapi uvicorn "psycopg[binary]" httpx pytest
      - name: Apply schema
        env:
          PGPASSWORD: proof
          PGHOST: localhost
          PGUSER: proof
          PGDATABASE: faos_proof
        run: |
          set -euo pipefail
          echo "=== SHA ==="
          git rev-parse HEAD
          psql -c "CREATE ROLE faos_app; CREATE ROLE faos_writer; CREATE ROLE faos_fixture;"
          for f in migrations/000[1-2]_*.sql migrations/0009_capacity_reservations.sql migrations/0010_routing_results.sql migrations/0011_add_routing_requested_kind.sql migrations/0012_location_geometry.sql migrations/0013_location_brand.sql migrations/0014_add_dealer_decision_kinds.sql; do
            [ -f "$f" ] || continue
            psql -f "$f"
          done
          psql -c "INSERT INTO faos.organizations (tenant_id, name) VALUES ('11111111-1111-1111-1111-111111111111', 'tenant-a'), ('22222222-2222-2222-2222-222222222222', 'tenant-b');"
          psql -c "INSERT INTO faos.dealer_groups (tenant_id, group_id, name) VALUES ('11111111-1111-1111-1111-111111111111', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'synthetic-group');"
          psql -c "INSERT INTO faos.dealer_locations (tenant_id, location_id, group_id, name, enabled, geom, brand) VALUES ('11111111-1111-1111-1111-111111111111', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'synthetic-loc-a', true, ST_SetSRID(ST_MakePoint(-98.5, 29.4), 4326), 'Honda'), ('11111111-1111-1111-1111-111111111111', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa', 'synthetic-loc-b', true, ST_SetSRID(ST_MakePoint(-98.6, 29.5), 4326), 'Toyota');"
          psql -c "INSERT INTO faos.location_capacity (tenant_id, location_id, capacity) VALUES ('11111111-1111-1111-1111-111111111111', 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb', 2), ('11111111-1111-1111-1111-111111111111', 'cccccccc-cccc-cccc-cccc-cccccccccccc', 1);"
          psql -c "INSERT INTO faos.routing_policies (tenant_id, policy_id, version, service_radius_meters, expiry_window_seconds) VALUES ('11111111-1111-1111-1111-111111111111', 'dddddddd-dddd-dddd-dddd-dddddddddddd', 'v1-synthetic', 50000, 14400);"
      - name: Authenticated session persist + RLS
        env:
          APP_DATABASE_URL: postgresql://proof:proof@localhost/faos_proof
          PGPASSWORD: proof
          PGHOST: localhost
          PGUSER: proof
          PGDATABASE: faos_proof
          PYTHONPATH: .
        run: |
          set -euo pipefail
          echo "=== AUTHENTICATED INSERT ==="
          python tests/api/session_auth_rls_proof.py
          echo "=== VISIBLE TO TENANT A ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '11111111-1111-1111-1111-111111111111'; SELECT count(*) FROM faos.sessions;"
          echo "=== SESSION_CREATED VISIBLE TO TENANT A ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '11111111-1111-1111-1111-111111111111'; SELECT count(*) FROM faos.events WHERE kind = 'SESSION_CREATED';"
          echo "=== ROUTING_RESULTS VISIBLE TO TENANT A ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '11111111-1111-1111-1111-111111111111'; SELECT count(*) FROM faos.routing_results;"
          echo "=== INVISIBLE TO TENANT B ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '22222222-2222-2222-2222-222222222222'; SELECT count(*) FROM faos.sessions;"
          echo "=== AUTHENTICATED RLS PROOF DONE ==="
