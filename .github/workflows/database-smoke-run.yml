name: Database placeholder smoke run

on:
  push:
    branches:
      - 'database-acceptance-run/**'
  workflow_dispatch:

jobs:
  smoke-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'psycopg[binary,pool]>=3.1.18'
      - name: Start ephemeral PostGIS container
        run: docker compose -p faos-active-run -f compose.database-tests.yml up -d --wait
      - name: Apply bootstrap and configure synthetic roles
        run: |
          docker cp database/bootstrap.sql faos-active-run-database-1:/tmp/bootstrap.sql
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -f /tmp/bootstrap.sql
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -c "ALTER ROLE faos_migrator PASSWORD 'synthetic-migrator-only';"
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -c "ALTER ROLE faos_app PASSWORD 'synthetic-app-only';"
      - name: Run migrations and guarded verification
        env:
          FAOS_MIGRATIONS_ALREADY_APPLIED: '1'
        run: |
          mkdir -p output/database-runs/migration-preflight
          set -o pipefail
          python -m database.migrate 2>&1 | tee output/database-runs/migration-preflight/migrations.log
          bash scripts/run_guarded_database_acceptance.sh
      - name: Upload smoke-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-smoke-run-evidence
          path: output/database-runs/
          if-no-files-found: warn
      - name: Remove ephemeral test container
        if: always()
        run: docker compose -p faos-active-run -f compose.database-tests.yml down -v
