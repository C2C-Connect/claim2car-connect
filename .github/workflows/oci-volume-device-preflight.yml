name: OCI volume identity preflight tests

on:
  pull_request:
    paths:
      - "scripts/oci_volume_device_map.py"
      - "tests/api/test_oci_volume_device_map.py"
      - ".github/workflows/oci-volume-device-preflight.yml"
  push:
    branches: ["infra/**"]
    paths:
      - "scripts/oci_volume_device_map.py"
      - "tests/api/test_oci_volume_device_map.py"
      - ".github/workflows/oci-volume-device-preflight.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run OCI volume identity tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/api/test_oci_volume_device_map.py -q
