name: Session persist RLS proof

on:
  workflow_dispatch:
  push:
    branches:
      - phase1-foundation-bootstrap
    paths:
      - 'app/sessions.py'
      - '.github/workflows/session-persist-rls.yml'

jobs:
  session-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: proof
          POSTGRES_USER: proof
          POSTGRES_DB: faos_proof
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-foundation-bootstrap
      - name: Install client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema and prove session RLS
        env:
          PGPASSWORD: proof
          PGHOST: localhost
          PGUSER: proof
          PGDATABASE: faos_proof
        run: |
          set -euo pipefail
          echo "=== SHA ==="
          git rev-parse HEAD
          psql -c "CREATE ROLE faos_app; CREATE ROLE faos_writer; CREATE ROLE faos_fixture;"
          for f in migrations/000[1-2]_*.sql; do
            [ -f "$f" ] || continue
            psql -f "$f"
          done
          psql -c "INSERT INTO faos.organizations (tenant_id, name) VALUES ('11111111-1111-1111-1111-111111111111', 'tenant-a'), ('22222222-2222-2222-2222-222222222222', 'tenant-b');"
          echo "=== INSERT SESSION AS TENANT A ==="
          psql -c "SELECT set_config('faos.tenant_id', '11111111-1111-1111-1111-111111111111', true); INSERT INTO faos.sessions (tenant_id, session_id) VALUES ('11111111-1111-1111-1111-111111111111', 'session-a-1');"
          echo "=== VISIBLE TO TENANT A ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '11111111-1111-1111-1111-111111111111'; SELECT count(*) FROM faos.sessions;"
          echo "=== INVISIBLE TO TENANT B ==="
          psql -c "SET ROLE faos_app; SET faos.tenant_id = '22222222-2222-2222-2222-222222222222'; SELECT count(*) FROM faos.sessions;"
          echo "=== SESSION RLS PROOF DONE ==="
