name: Full test suite

# Runs the ENTIRE pytest suite (unit + database + integration) so that broken
# imports or missing constants can never hide behind narrow per-area workflows.
# Slice 1 of the five-slice execution plan (2026-11-06).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main, acceptance, 'acceptance/**', 'release/**', 'rc/**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_DATABASE_URL: postgresql://faos_app:synthetic-app-only@127.0.0.1:55432/claim2car_test
      MIGRATION_DATABASE_URL: postgresql://faos_migrator:synthetic-migrator-only@127.0.0.1:55432/claim2car_test
      ROUTING_DATABASE_URL: postgresql://faos_app:synthetic-app-only@127.0.0.1:55433/claim2car_routing_test
      ROUTING_MIGRATION_DATABASE_URL: postgresql://faos_migrator:synthetic-migrator-only@127.0.0.1:55433/claim2car_routing_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all dependencies
        run: |
          pip install -r requirements.txt -r requirements-api.txt
      - name: Start disposable database and bootstrap restricted synthetic roles
        run: |
          docker compose -p full-suite-run -f compose.database-tests.yml up -d --wait
          docker cp database/bootstrap.sql full-suite-run-database-1:/tmp/bootstrap.sql
          docker exec full-suite-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -f /tmp/bootstrap.sql
          docker exec full-suite-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -c "ALTER ROLE faos_migrator PASSWORD 'synthetic-migrator-only'; ALTER ROLE faos_app PASSWORD 'synthetic-app-only';"
      - name: Bootstrap routing database (pgRouting extension + restricted roles)
        run: |
          docker exec full-suite-run-routing-1 psql -U postgres -d claim2car_routing_test -v ON_ERROR_STOP=1 -c "CREATE ROLE faos_migrator LOGIN; CREATE ROLE faos_app LOGIN; CREATE ROLE faos_fixture LOGIN; CREATE ROLE faos_writer NOLOGIN; CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pgrouting; GRANT CONNECT ON DATABASE claim2car_routing_test TO faos_migrator, faos_app, faos_fixture; GRANT USAGE, CREATE ON SCHEMA public TO faos_migrator; GRANT CREATE ON DATABASE claim2car_routing_test TO faos_migrator; GRANT faos_writer TO faos_migrator;"
          docker exec full-suite-run-routing-1 psql -U postgres -d claim2car_routing_test -v ON_ERROR_STOP=1 -c "ALTER ROLE faos_migrator PASSWORD 'synthetic-migrator-only'; ALTER ROLE faos_app PASSWORD 'synthetic-app-only';"
      # Shared legacy integration fixtures target the pre-cutover schema through 0007.
      # Full-authority migration and tenant-login tests create isolated databases
      # and exercise the complete authority plan independently.
      - name: Apply legacy baseline for shared database integration fixtures
        env:
          FAOS_LEGACY_BASELINE_ALLOWED: '1'
        run: python -m database.migrate --legacy-baseline
      - name: Apply routing migrations
        run: python -m database.migrate --routing
      - name: Run full pytest suite
        run: |
          set -o pipefail
          mkdir -p output/full-suite
          # These seven cases require the post-cutover authority schema and
          # cannot execute against this workflow's deliberate 0001-0007
          # legacy fixture baseline. They remain mandatory and are executed
          # in the separate post-cutover database-authority workflow. Deselect
          # them here so the legacy comparison lane reports zero test skips;
          # do not remove them from the authority suite or its gate selectors.
          python -m pytest tests/ -q \
            --deselect='tests/database/test_completion_receipts.py::CompletionReceiptTests::test_receipt_inspection_fails_closed_on_root_binding_tamper' \
            --deselect='tests/database/test_completion_receipts.py::CompletionReceiptTests::test_receipt_write_rejects_root_binding_tamper' \
            --deselect='tests/database/test_manifest_roots.py::ManifestRootTests::test_authority_fixture_roles_are_bound_to_tenant' \
            --deselect='tests/database/test_manifest_roots.py::ManifestRootTests::test_privileged_context_binding_tamper_fails_verification' \
            --deselect='tests/database/test_manifest_roots.py::ManifestRootTests::test_registered_binding_rejects_tampered_chain_tail' \
            --deselect='tests/database/test_manifest_roots.py::ManifestRootTests::test_registered_root_contains_and_verifies_seal_chain_binding' \
            --deselect='tests/database/test_registered_completion.py::RegisteredCompletionTests::test_registered_root_context_binding_tamper_fails_closed' \
            --junitxml=output/full-suite/junit.xml 2>&1 | tee output/full-suite/pytest.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-evidence
          path: output/full-suite/
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker compose -p full-suite-run -f compose.database-tests.yml down -v
