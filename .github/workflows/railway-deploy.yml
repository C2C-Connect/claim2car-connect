name: Railway staging verification and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: "463d410b-09a3-4117-a3b5-05e6646e7807"
  RAILWAY_CLI_VERSION: "5.71.0"
  CI: "true"

jobs:
  verify:
    name: Railway restricted staging verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        run: pip install -r requirements-api.txt 'httpx>=0.27,<1' 'pytest>=8,<10'
      - name: Verify API and dispatch containment regressions
        run: python -m pytest tests/api tests/test_dispatch.py -q
      - name: Stamp and build restricted Railway runtime
        run: |
          printf '%s\n' "$GITHUB_SHA" > app/_build_revision.txt
          docker build --file Dockerfile.railway --tag claim2car-railway:ci .
          test "$(docker run --rm --entrypoint id claim2car-railway:ci -u)" = 10001
      - name: Start with dynamic port and restricted filesystem
        run: |
          docker run -d --name c2c-railway-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e PORT=18765 -p 127.0.0.1:18001:18765 claim2car-railway:ci
      - name: Verify exact revision and live HTTP safety boundaries
        run: |
          python scripts/railway_smoke.py --base-url http://127.0.0.1:18001 \
            --expected-revision "$GITHUB_SHA" --wait-seconds 90
      - name: Remove disposable container
        if: always()
        run: docker rm -f c2c-railway-smoke || true
      - name: Report deployment remains disabled
        if: github.event_name != 'pull_request' && vars.RAILWAY_DEPLOY_ENABLED != 'true'
        run: |
          printf '%s\n' 'Verification only: Railway deployment is disabled until the staging target, secrets, and HTTPS URL are configured.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified restricted staging
    needs: verify
    # Enable only after all secrets and the explicitly selected staging target
    # have been checked. An unset flag deliberately leaves deployment disabled.
    if: github.ref == 'refs/heads/main' && vars.RAILWAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: railway-463d410b-09a3-4117-a3b5-05e6646e7807
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned Railway CLI
        run: |
          npm install --global "@railway/cli@${RAILWAY_CLI_VERSION}"
          railway --version
      - name: Validate settings and deploy exact revision
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_STAGING_URL: ${{ vars.RAILWAY_STAGING_URL }}
        run: bash scripts/railway_deploy.sh
      - name: Verify public deployment
        if: steps.upload.outputs.deployed == 'true'
        env:
          STAGING_URL: ${{ vars.RAILWAY_STAGING_URL }}
        run: |
          python3 scripts/railway_smoke.py --base-url "$STAGING_URL" \
            --expected-revision "$GITHUB_SHA" --wait-seconds 120
