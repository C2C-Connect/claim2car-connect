name: OCI staging infrastructure plan (manual, no apply)

on:
  pull_request:
    paths:
      - ".github/workflows/oci-staging-plan.yml"
      - "infra/oci/staging/**"
  push:
    branches: ["infra/**"]
    paths:
      - ".github/workflows/oci-staging-plan.yml"
      - "infra/oci/staging/**"
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Confirm this is a plan-only run; no infrastructure will be applied."
        required: true
        type: choice
        options:
          - "PLAN_ONLY_NO_APPLY"
      region:
        description: OCI region
        required: true
        type: string
        default: us-chicago-1

permissions:
  contents: read

jobs:
  static-validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Parse workflow and assert plan-only safety boundary
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path(".github/workflows/oci-staging-plan.yml").read_text())
          trigger = workflow.get("on", workflow.get(True))
          assert isinstance(trigger, dict) and "workflow_dispatch" in trigger
          assert "pull_request" in trigger and "push" in trigger
          plan = workflow["jobs"]["plan"]
          assert plan["environment"] == "oci-staging"
          joined = "\\n".join(step.get("run", "") for step in plan["steps"])
          assert "terraform plan" in joined
          assert "terraform apply" not in joined
          assert "Destructive changes detected" in joined
          print("PASS: workflow YAML, triggers, protected environment, plan-only and destructive-change guard")
          PY
      - name: Validate embedded shell syntax
        run: |
          python - <<'PY'
          import re, subprocess, yaml
          workflow = yaml.safe_load(open(".github/workflows/oci-staging-plan.yml"))
          for job in workflow["jobs"].values():
              for index, step in enumerate(job.get("steps", [])):
                  if "run" in step:
                      script = re.sub(r"\$\{\{.*?\}\}", "SAFE_EXPR", step["run"])
                      result = subprocess.run(["bash", "-n"], input=script, text=True, capture_output=True)
                      if result.returncode:
                          raise SystemExit(f"Shell syntax error in {step.get('name', index)}: {result.stderr}")
          print("PASS: bash syntax for embedded scripts")
          PY
      - name: Validate Terraform configuration
        working-directory: infra/oci/staging
        run: |
          terraform fmt -diff -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oci-staging
    defaults:
      run:
        working-directory: infra/oci/staging
    env:
      OCI_CONFIG_FILE: ${{ runner.temp }}/oci-config
      TF_VAR_region: ${{ inputs.region }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_vcn_ocid: ${{ secrets.OCI_VCN_OCID }}
      TF_VAR_private_subnet_ocid: ${{ secrets.OCI_PRIVATE_SUBNET_OCID }}
      TF_VAR_image_ocid: ${{ secrets.OCI_STAGING_IMAGE_OCID }}
      TF_VAR_admin_ingress_cidrs: ${{ secrets.OCI_ADMIN_INGRESS_CIDRS_JSON || '[]' }}
      TF_VAR_app_ingress_cidrs: ${{ secrets.OCI_APP_INGRESS_CIDRS_JSON || '[]' }}
      TF_VAR_ssh_authorized_keys: ${{ secrets.OCI_STAGING_SSH_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Fail closed when OCI credentials or inputs are absent
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VCN: ${{ secrets.OCI_VCN_OCID }}
          SUBNET: ${{ secrets.OCI_PRIVATE_SUBNET_OCID }}
          IMAGE: ${{ secrets.OCI_STAGING_IMAGE_OCID }}
          ADMIN_CIDRS: ${{ secrets.OCI_ADMIN_INGRESS_CIDRS_JSON }}
          APP_CIDRS: ${{ secrets.OCI_APP_INGRESS_CIDRS_JSON }}
        run: |
          set -euo pipefail
          missing=()
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY COMPARTMENT VCN SUBNET IMAGE; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ -z "$ADMIN_CIDRS" ]]; then ADMIN_CIDRS='[]'; fi
          if [[ -z "$APP_CIDRS" ]]; then APP_CIDRS='[]'; fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ADMIN_CIDRS" >/dev/null; then
            echo "OCI_ADMIN_INGRESS_CIDRS_JSON must be a JSON string array."
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$APP_CIDRS" >/dev/null; then
            echo "OCI_APP_INGRESS_CIDRS_JSON must be a JSON string array."
            exit 1
          fi
          if jq -e 'any(.[]; . == "0.0.0.0/0" or . == "::/0")' <<<"$ADMIN_CIDRS" >/dev/null; then
            echo "Public SSH ingress is prohibited."
            exit 1
          fi
          if jq -e 'any(.[]; . == "0.0.0.0/0" or . == "::/0")' <<<"$APP_CIDRS" >/dev/null; then
            echo "Public application ingress is prohibited."
            exit 1
          fi
          if (("${#missing[@]}" > 0)); then
            printf 'Missing required OCI environment secrets: %s\n' "${missing[*]}"
            echo "Configure these in the protected oci-staging environment before running a plan."
            exit 1
          fi
          install -d -m 0700 "$(dirname "$OCI_CONFIG_FILE")"
          key_path="$(dirname "$OCI_CONFIG_FILE")/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_path"
          chmod 0600 "$key_path"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          fingerprint=$OCI_FINGERPRINT
          key_file=$key_path
          region=${{ inputs.region }}
          EOF
          chmod 0600 "$OCI_CONFIG_FILE"
          openssl pkey -in "$key_path" -check -noout >/dev/null
          echo "OCI credentials and cost/network guard inputs validated (values redacted)."
      - name: Initialize provider without remote backend
        run: terraform init -backend=false -input=false
      - name: Validate staging stack
        run: terraform validate -no-color
      - name: Generate plan only (never apply)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan-output.txt 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            echo "Terraform plan failed. Detailed output is intentionally not echoed because it may contain environment identifiers."
            exit "$rc"
          fi
          terraform show -json tfplan > tfplan.json
          summary="$(jq -r '
            [.resource_changes[]?.change.actions] |
            {
              create: ([.[] | select(. == ["create"])] | length),
              update: ([.[] | select(. == ["update"])] | length),
              delete: ([.[] | select(any(.[]; . == "delete"))] | length),
              replace: ([.[] | select(length == 2 and (index("delete") != null and index("create") != null))] | length)
            }' tfplan.json)"
          echo "$summary" | tee "$GITHUB_STEP_SUMMARY"
          if jq -e '.delete > 0 or .replace > 0' <<<"$summary" >/dev/null; then
            echo "Destructive changes detected; plan is rejected."
            exit 1
          fi
          echo "Plan completed. No apply step exists in this workflow."
