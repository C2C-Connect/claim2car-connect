name: OCI staging infrastructure plan (manual, no apply)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oci-staging
    defaults:
      run:
        working-directory: infra/oci/staging
    env:
      TF_VAR_region: us-chicago-1
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_vcn_ocid: ${{ secrets.OCI_VCN_OCID }}
      TF_VAR_private_subnet_ocid: ${{ secrets.OCI_PRIVATE_SUBNET_OCID }}
      TF_VAR_image_ocid: ${{ secrets.OCI_STAGING_IMAGE_OCID }}
      TF_VAR_ssh_authorized_keys: ${{ secrets.OCI_STAGING_SSH_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
      - name: Fail closed when OCI credentials or inputs are absent
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          COMPARTMENT: ${{ secrets.OCI_COMPARTMENT_OCID }}
          VCN: ${{ secrets.OCI_VCN_OCID }}
          SUBNET: ${{ secrets.OCI_PRIVATE_SUBNET_OCID }}
          IMAGE: ${{ secrets.OCI_STAGING_IMAGE_OCID }}
          ADMIN_CIDRS: ${{ secrets.OCI_ADMIN_INGRESS_CIDRS_JSON }}
          APP_CIDRS: ${{ secrets.OCI_APP_INGRESS_CIDRS_JSON }}
          STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
        run: |
          set -euo pipefail
          OCI_CONFIG_FILE="$RUNNER_TEMP/oci-config"
          export OCI_CONFIG_FILE
          echo "OCI_CONFIG_FILE=$OCI_CONFIG_FILE" >> "$GITHUB_ENV"
          missing=()
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY COMPARTMENT VCN SUBNET IMAGE STATE_BUCKET STATE_NAMESPACE; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ -z "$ADMIN_CIDRS" ]]; then ADMIN_CIDRS='[]'; fi
          if [[ -z "$APP_CIDRS" ]]; then APP_CIDRS='[]'; fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$ADMIN_CIDRS" >/dev/null; then
            echo "OCI_ADMIN_INGRESS_CIDRS_JSON must be a JSON string array."
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<<"$APP_CIDRS" >/dev/null; then
            echo "OCI_APP_INGRESS_CIDRS_JSON must be a JSON string array."
            exit 1
          fi
          if jq -e 'any(.[]; . == "0.0.0.0/0" or . == "::/0")' <<<"$ADMIN_CIDRS" >/dev/null; then
            echo "Public SSH ingress is prohibited."
            exit 1
          fi
          if jq -e 'any(.[]; . == "0.0.0.0/0" or . == "::/0")' <<<"$APP_CIDRS" >/dev/null; then
            echo "Public application ingress is prohibited."
            exit 1
          fi
          if (("${#missing[@]}" > 0)); then
            printf 'Missing required OCI environment secrets: %s\n' "${missing[*]}"
            echo "Configure these in the protected oci-staging environment before running a plan."
            exit 1
          fi
          printf 'TF_VAR_admin_ingress_cidrs=%s\n' "$ADMIN_CIDRS" >> "$GITHUB_ENV"
          printf 'TF_VAR_app_ingress_cidrs=%s\n' "$APP_CIDRS" >> "$GITHUB_ENV"
          install -d -m 0700 "$(dirname "$OCI_CONFIG_FILE")"
          key_path="$(dirname "$OCI_CONFIG_FILE")/oci_api_key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$key_path"
          chmod 0600 "$key_path"
          cat > "$OCI_CONFIG_FILE" <<EOF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          fingerprint=$OCI_FINGERPRINT
          key_file=$key_path
          region=us-chicago-1
          EOF
          chmod 0600 "$OCI_CONFIG_FILE"
          openssl pkey -in "$key_path" -check -noout >/dev/null
          echo "OCI credentials and cost/network guard inputs validated (values redacted)."
      - name: Initialize OCI remote state backend
        run: |
          set -euo pipefail
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="key=claim2car/oci-staging.tfstate" \
            -backend-config="region=us-chicago-1" \
            -backend-config="config_file_profile=DEFAULT"
      - name: Validate staging stack
        run: terraform validate -no-color
      - name: Generate plan only (never apply)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan-output.txt 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            echo "Terraform plan failed. Detailed output is intentionally not echoed because it may contain environment identifiers."
            exit "$rc"
          fi
          terraform show -json tfplan > tfplan.json
          summary="$(jq -r '
            [.resource_changes[]?.change.actions] |
            {
              create: ([.[] | select(. == ["create"])] | length),
              update: ([.[] | select(. == ["update"])] | length),
              delete: ([.[] | select(any(.[]; . == "delete"))] | length),
              replace: ([.[] | select(length == 2 and (index("delete") != null and index("create") != null))] | length)
            }' tfplan.json)"
          echo "$summary" | tee "$GITHUB_STEP_SUMMARY"
          if jq -e '.delete > 0 or .replace > 0' <<<"$summary" >/dev/null; then
            echo "Destructive changes detected; plan is rejected."
            exit 1
          fi
          echo "Plan completed. No apply step exists in this workflow."
