name: Deploy integrated Claim2Car image to private OCI staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Explicitly authorize deployment to the private staging instance
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
      image_ref:
        description: Exact OCIR image reference from publish run (commit tag plus sha256 digest)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: claim2car-private-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: oci-staging-apply
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned OCI CLI
        run: python -m pip install --no-cache-dir oci-cli==3.96.3
      - name: Validate protected inputs, immutable image, and configure OCI API credentials
        id: preflight
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_STAGING_INSTANCE_OCID: ${{ vars.OCI_STAGING_INSTANCE_OCID }}
          OCI_OCIR_AUTH_SECRET_OCID: ${{ vars.OCI_OCIR_AUTH_SECRET_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION || 'us-chicago-1' }}
          OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}
          C2C_IMAGE_REF: ${{ inputs.image_ref }}
          C2C_POSTGRES_IMAGE: ${{ vars.C2C_POSTGRES_IMAGE }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Private deployment is allowed only from main."; exit 1; }
          missing=()
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_COMPARTMENT_OCID OCI_STAGING_INSTANCE_OCID OCI_OCIR_AUTH_SECRET_OCID OCI_REGION OCIR_NAMESPACE OCIR_REPOSITORY C2C_IMAGE_REF C2C_POSTGRES_IMAGE; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( "${#missing[@]}" > 0 )); then
            printf 'Missing protected staging inputs: %s\n' "${missing[*]}"
            exit 1
          fi
          registry="${OCI_REGION}.ocir.io"
          [[ "${OCI_REGION}" =~ ^[a-z0-9-]+$ ]] || { echo "OCI_REGION invalid."; exit 1; }
          [[ "${OCI_REGION}" == "us-chicago-1" ]] || { echo "Private staging deployment is restricted to us-chicago-1."; exit 1; }
          [[ "${OCIR_NAMESPACE}" =~ ^[a-z0-9]+$ ]] || { echo "OCIR_NAMESPACE invalid."; exit 1; }
          [[ "${OCIR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo "OCIR_REPOSITORY invalid."; exit 1; }
          [[ "${C2C_IMAGE_REF}" == "${registry}/${OCIR_NAMESPACE}/${OCIR_REPOSITORY}:"* ]] || { echo "Image is not in the configured OCIR repository."; exit 1; }
          if [[ "${C2C_IMAGE_REF}" =~ :sha-([a-f0-9]{40})@sha256:([a-f0-9]{64})$ ]]; then
            commit="${BASH_REMATCH[1]}"
          else
            echo "Image must have a commit SHA tag and immutable sha256 digest."; exit 1
          fi
          [[ "${C2C_POSTGRES_IMAGE}" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "PostgreSQL image must be digest-pinned."; exit 1; }
          git merge-base --is-ancestor "${commit}" origin/main || { echo "Image source commit is not on main."; exit 1; }
          git show "${commit}:scripts/oci_staging_runtime_deploy.sh" > "${RUNNER_TEMP}/deploy-script.sh"
          script_sha="$(sha256sum "${RUNNER_TEMP}/deploy-script.sh" | awk '{print $1}')"
          {
            echo "OCI_REGISTRY=${registry}"
            echo "C2C_DEPLOY_SCRIPT_SHA256=${script_sha}"
          } >> "${GITHUB_ENV}"
          install -d -m 0700 "${HOME}/.oci"
          key_path="${RUNNER_TEMP}/oci_api_key.pem"
          printf '%s\n' "${OCI_PRIVATE_KEY}" > "${key_path}"
          chmod 0600 "${key_path}"
          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER}
          tenancy=${OCI_TENANCY}
          fingerprint=${OCI_FINGERPRINT}
          key_file=${key_path}
          region=${OCI_REGION}
          EOF
          chmod 0600 "${HOME}/.oci/config"
          openssl pkey -in "${key_path}" -check -noout >/dev/null
          echo "Preflight passed. Command payload will include image metadata and Vault secret OCID only, never registry credentials."
      - name: Submit and verify private OCI Run Command deployment
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_STAGING_INSTANCE_OCID: ${{ vars.OCI_STAGING_INSTANCE_OCID }}
          OCI_REGISTRY: ${{ (vars.OCI_REGION || 'us-chicago-1') }}.ocir.io
          OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          OCIR_REPOSITORY: ${{ vars.OCIR_REPOSITORY }}
          OCI_OCIR_AUTH_SECRET_OCID: ${{ vars.OCI_OCIR_AUTH_SECRET_OCID }}
          C2C_IMAGE_REF: ${{ inputs.image_ref }}
          C2C_POSTGRES_IMAGE: ${{ vars.C2C_POSTGRES_IMAGE }}
        run: |
          set -euo pipefail
          python scripts/oci_staging_runcommand_deploy.py
      - name: Report deployment command result
        if: always()
        run: |
          {
            echo "## Private OCI staging deployment"
            echo
            echo "Deployment was requested through OCI Instance Agent Run Command; no inbound SSH/public IP is used."
            echo "Registry credentials are retrieved on the instance from the Vault secret identified by OCIR secret OCID."
            echo "Review the Run Command execution in OCI if the job fails."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Remove temporary OCI API key and config
        if: always()
        run: |
          rm -rf "${HOME}/.oci"
          rm -f "${RUNNER_TEMP}/oci_api_key.pem" "${RUNNER_TEMP}/deploy-script.sh"
