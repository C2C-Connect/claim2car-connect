name: OCI infrastructure validation

on:
  pull_request:
    paths:
      - "infra/oci/**"
      - ".github/workflows/oci-infrastructure-validate.yml"
      - ".github/workflows/oci-staging-plan.yml"
      - ".github/workflows/oci-staging-apply.yml"
      - ".github/workflows/oci-integrated-image-publish.yml"
      - ".github/workflows/integrated-container-smoke.yml"
  push:
    branches: [main, "infra/**"]
    paths:
      - "infra/oci/**"
      - ".github/workflows/oci-infrastructure-validate.yml"
      - ".github/workflows/oci-staging-plan.yml"
      - ".github/workflows/oci-integrated-image-publish.yml"
      - ".github/workflows/integrated-container-smoke.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/oci/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"
      - name: Lint the two OCI workflows with pinned actionlint
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/oci-staging-plan.yml .github/workflows/oci-staging-apply.yml .github/workflows/oci-integrated-image-publish.yml .github/workflows/integrated-container-smoke.yml .github/workflows/oci-infrastructure-validate.yml
      - name: Validate manual OCI plan, apply and image publish workflow YAML and shell
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import re, subprocess, yaml
          path = ".github/workflows/oci-staging-plan.yml"
          workflow = yaml.safe_load(open(path))
          terraform_config = open("infra/oci/staging/versions.tf", encoding="utf-8").read()
          assert 'required_version = ">= 1.12.0"' in terraform_config
          assert 'backend "oci" {}' in terraform_config
          init_step = next(step for step in workflow["jobs"]["plan"]["steps"] if step.get("name") == "Initialize OCI remote state backend")
          assert "terraform init -input=false -reconfigure" in init_step["run"]
          credentials_step = next(step for step in workflow["jobs"]["plan"]["steps"] if step.get("name") == "Fail closed when OCI credentials or inputs are absent")
          assert 'config_path="$HOME/.oci/config"' in credentials_step["run"]
          assert "OCI_CONFIG_FILE" not in credentials_step["run"]
          apply_path = ".github/workflows/oci-staging-apply.yml"
          apply = yaml.safe_load(open(apply_path))
          apply_trigger = apply.get("on", apply.get(True))
          assert isinstance(apply_trigger, dict) and set(apply_trigger) == {"workflow_dispatch"}
          plan_job = apply["jobs"]["plan"]
          apply_job = apply["jobs"]["apply"]
          assert plan_job["environment"] == "oci-staging"
          assert apply_job["environment"] == "oci-staging-apply" and apply_job["needs"] == "plan"
          assert "refs/heads/main" in plan_job["if"] and "confirm_apply == 'yes'" in plan_job["if"]
          assert "refs/heads/main" in apply_job["if"] and "confirm_apply == 'yes'" in apply_job["if"]
          plan_scripts = [step["run"] for step in plan_job["steps"] if "run" in step]
          apply_scripts = [step["run"] for step in apply_job["steps"] if "run" in step]
          plan_combined = "\\n".join(plan_scripts)
          apply_combined = "\\n".join(apply_scripts)
          assert "terraform plan" in plan_combined and "terraform apply" not in plan_combined
          assert "Destructive changes rejected" in plan_combined and "delete" in plan_combined and "replace" in plan_combined
          assert "terraform apply -input=false -no-color tfplan" in apply_combined
          assert any(step.get("uses", "").startswith("actions/upload-artifact@") for step in plan_job["steps"])
          assert any(step.get("uses", "").startswith("actions/download-artifact@") for step in apply_job["steps"])
          assert "oci-staging-plan-" in str(plan_job["steps"])
          assert "terraform destroy" not in plan_combined + apply_combined
          apply_scripts = plan_scripts + apply_scripts
          publish_path = ".github/workflows/oci-integrated-image-publish.yml"
          publish = yaml.safe_load(open(publish_path))
          publish_trigger = publish.get("on", publish.get(True))
          assert isinstance(publish_trigger, dict) and set(publish_trigger) == {"workflow_dispatch"}
          publish_job = publish["jobs"]["publish"]
          assert publish_job["environment"] == "oci-staging"
          assert "refs/heads/main" in publish_job["if"] and "confirm_publish == 'yes'" in publish_job["if"]
          publish_steps = publish_job["steps"]
          assert any(step.get("id") == "validate" and "GITHUB_OUTPUT" in step.get("run", "") for step in publish_steps)
          assert any(step.get("uses", "").startswith("docker/setup-qemu-action@") for step in publish_steps), "ARM64 build must configure emulation"
          assert any(step.get("uses", "").startswith("docker/login-action@") for step in publish_steps)
          builder = next(step for step in publish_steps if step.get("uses", "").startswith("docker/build-push-action@"))
          assert builder["with"]["file"] == "Dockerfile.integrated" and builder["with"]["platforms"] == "linux/arm64" and builder["with"]["push"] is True
          assert "terraform apply" not in "\\n".join(step.get("run", "") for step in publish_steps)
          publish_scripts = [step["run"] for step in publish_steps if "run" in step]
          trigger = workflow.get("on", workflow.get(True))
          assert isinstance(trigger, dict) and set(trigger) == {"workflow_dispatch"}
          plan = workflow["jobs"]["plan"]
          assert plan["environment"] == "oci-staging"
          scripts = [step["run"] for step in plan["steps"] if "run" in step]
          combined = "\\n".join(scripts)
          assert "terraform plan" in combined
          assert "terraform apply" not in combined
          assert "backend-config=" in combined
          assert "OCI_STATE_BUCKET" in workflow["jobs"]["plan"]["env"]
          assert "OCI_STATE_NAMESPACE" in workflow["jobs"]["plan"]["env"]
          assert "-backend=false" not in combined
          assert "Destructive changes detected" in combined
          for script in scripts + publish_scripts + apply_scripts:
              script = re.sub(r"\$\{\{.*?\}\}", "SAFE_EXPR", script)
              checked = subprocess.run(["bash", "-n"], input=script, text=True, capture_output=True)
              if checked.returncode:
                  raise SystemExit(checked.stderr)
          print("PASS: manual dispatch only, plan-only boundary, destructive guard, and shell syntax")
          PY
      - name: Check Terraform formatting
        run: terraform fmt -diff -check -recursive
      - name: Initialize provider without backend
        run: terraform init -backend=false -input=false
      - name: Validate infrastructure configuration
        run: terraform validate -no-color
