name: OCI staging private-network ingress audit (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      subnet_ocid:
        description: Private staging subnet OCID to inspect
        type: string
        required: true
      expected_vcn_ocid:
        description: Expected Claim2Car VCN OCID
        type: string
        required: true
      network_security_group_ocids:
        description: Optional comma-separated NSG OCIDs attached to the staging VNIC
        type: string
        required: false
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: oci-staging
    env:
      OCI_REGION: ${{ vars.OCI_REGION || 'us-chicago-1' }}
      SUBNET_OCID: ${{ inputs.subnet_ocid }}
      EXPECTED_VCN_OCID: ${{ inputs.expected_vcn_ocid }}
      NSG_OCIDS: ${{ inputs.network_security_group_ocids }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OCI CLI pinned
        run: python -m pip install --quiet oci-cli==3.96.3
      - name: Configure ephemeral API credentials and validate OCIDs
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY SUBNET_OCID EXPECTED_VCN_OCID; do
            [[ -n "${!name}" ]] || { echo "Missing required audit input: ${name}"; exit 1; }
          done
          [[ "${SUBNET_OCID}" =~ ^ocid1\.subnet\. ]] || { echo "Invalid subnet OCID"; exit 1; }
          [[ "${EXPECTED_VCN_OCID}" =~ ^ocid1\.vcn\. ]] || { echo "Invalid expected VCN OCID"; exit 1; }
          install -d -m 0700 "${HOME}/.oci"
          key="${RUNNER_TEMP}/oci_api_key.pem"
          printf '%s\n' "${OCI_PRIVATE_KEY}" > "${key}"
          chmod 0600 "${key}"
          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER}
          tenancy=${OCI_TENANCY}
          fingerprint=${OCI_FINGERPRINT}
          key_file=${key}
          region=${OCI_REGION}
          EOF
          chmod 0600 "${HOME}/.oci/config"
          openssl pkey -in "${key}" -check -noout >/dev/null
          echo "Credential and identifier validation passed; values redacted."
      - name: Audit subnet and every attached security list
        run: |
          set -euo pipefail
          set +e
          nsg_args=()
          if [[ -n "${NSG_OCIDS}" ]]; then
            IFS=',' read -ra nsg_ids <<< "${NSG_OCIDS}"
            for nsg_id in "${nsg_ids[@]}"; do
              [[ "${nsg_id}" =~ ^ocid1\.networksecuritygroup\. ]] || { echo "Invalid NSG OCID"; exit 2; }
              nsg_args+=(--nsg-id "${nsg_id}")
            done
          fi
          python scripts/oci_staging_network_audit.py \
            --subnet-id "${SUBNET_OCID}" \
            --expected-vcn-id "${EXPECTED_VCN_OCID}" \
            "${nsg_args[@]}" 2>&1 | tee "${RUNNER_TEMP}/network-audit.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "${rc}" -eq 0 ]]; then
            {
              echo "## OCI staging network audit passed"
              echo "- Subnet belongs to expected VCN"
              echo "- Subnet prohibits public IP assignment"
              echo "- Every attached security list was inspected"
              if [[ -n "${NSG_OCIDS}" ]]; then echo "- Supplied staging NSGs and their ingress rules were inspected"; fi
              echo "- No IPv4 or IPv6 ingress source is unrestricted"
              echo "- Audit is read-only; no network rule changes were made"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## OCI staging network audit FAILED"
              echo "- The subnet identity, public-IP policy, security-list inventory, or ingress rules failed closed."
              echo "- Review the audit output and remediate in OCI through an approved change."
              echo "- This workflow is read-only and did not change any rules."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"
