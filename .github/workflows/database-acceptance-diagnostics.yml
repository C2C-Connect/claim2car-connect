name: Isolated database acceptance baseline diagnostics
on:
  push:
    branches:
      - 'database-acceptance-run/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DATABASE_URL: postgresql://faos_app:synthetic-app-only@127.0.0.1:55432/claim2car_test
      MIGRATION_DATABASE_URL: postgresql://faos_migrator:synthetic-migrator-only@127.0.0.1:55432/claim2car_test
      MIGRATION_TEST_ADMIN_URL: postgresql://postgres:synthetic-container-only@127.0.0.1:55432/claim2car_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies
        run: pip install 'psycopg[binary,pool]>=3.1.18'
      - name: Start isolated database
        run: docker compose -p faos-active-run -f compose.database-tests.yml up -d --wait
      - name: Bootstrap synthetic roles and apply actual migrations
        run: |
          mkdir -p output/acceptance-diagnostics
          docker cp database/bootstrap.sql faos-active-run-database-1:/tmp/bootstrap.sql
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -f /tmp/bootstrap.sql
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -c "ALTER ROLE faos_migrator PASSWORD 'synthetic-migrator-only'; ALTER ROLE faos_app PASSWORD 'synthetic-app-only';"
          set -o pipefail
          python -m database.migrate 2>&1 | tee output/acceptance-diagnostics/migrations.log
          git rev-parse HEAD > output/acceptance-diagnostics/commit.txt
          pip freeze > output/acceptance-diagnostics/python-dependencies.txt
          docker exec faos-active-run-database-1 psql -U postgres -d claim2car_test -v ON_ERROR_STOP=1 -c 'TABLE public.faos_migration_history;' > output/acceptance-diagnostics/migration-ledger.txt
      - name: Existing guarded component suite
        env:
          FAOS_MIGRATIONS_ALREADY_APPLIED: '1'
        run: bash scripts/run_guarded_database_acceptance.sh
      - name: Direct SQL baseline diagnostics
        if: ${{ !cancelled() }}
        run: |
          mkdir -p output/acceptance-diagnostics
          set -o pipefail
          python -m scripts.database_acceptance_diagnostics 2>&1 | tee output/acceptance-diagnostics/diagnostics.log
      - name: Preserve environment evidence
        if: always()
        run: |
          mkdir -p output/acceptance-diagnostics
          docker compose -p faos-active-run -f compose.database-tests.yml ps -a > output/acceptance-diagnostics/container-state.txt
          docker compose -p faos-active-run -f compose.database-tests.yml logs --no-color > output/acceptance-diagnostics/container.log
          docker image inspect postgis/postgis:16-3.4 > output/acceptance-diagnostics/image.json
      - name: Upload baseline evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-baseline-diagnostics
          path: output/
          if-no-files-found: error
      - name: Prepare connector-readable structured evidence
        if: always()
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          source = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          run = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          out = Path('acceptance-evidence') / (run+'-'+attempt)
          out.mkdir(parents=True,exist_ok=True)
          metadata = {'candidate_commit':source,'run_id':run,'run_attempt':attempt,
                      'classification':'component-and-diagnostic-evidence-not-gate-certification',
                      'gate_passes_awarded':0}
          report = Path('output/acceptance-diagnostics/report.json')
          metadata['diagnostic_report_present'] = report.is_file()
          if report.is_file():
              value = json.loads(report.read_text())
              allowed = ('classification','commit','contract','gate_passes_awarded','checks','database','extensions','complete_gate_results','overall_acceptance','diagnostics_successful','execution_error_type')
              (out/'diagnostic-report.json').write_text(json.dumps({k:value[k] for k in allowed if k in value},indent=2)+'\n')
          counted = list(Path('output/database-runs').rglob('counted-tests.json'))
          metadata['counted_test_report_count'] = len(counted)
          if len(counted) == 1:
              value = json.loads(counted[0].read_text())
              allowed = ('suite','discovered','executed','failures','errors','skipped','expected_failures','unexpected_successes','successful','tests')
              (out/'counted-tests.json').write_text(json.dumps({k:value[k] for k in allowed if k in value},indent=2)+'\n')
          (out/'evidence-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
      - name: Publish evidence without changing candidate branch
        if: always()
        run: |
          evidence_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f "acceptance-evidence/$evidence_id/evidence-metadata.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "acceptance-evidence/$evidence_id"
          git add "acceptance-evidence/$evidence_id/"
          git commit -m "Preserve structured diagnostic evidence for $evidence_id"
          git push origin "HEAD:refs/heads/acceptance-evidence/$evidence_id"
      - name: Remove isolated database
        if: always()
        run: docker compose -p faos-active-run -f compose.database-tests.yml down -v
