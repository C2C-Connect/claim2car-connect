name: Bootstrap private OCI Terraform state bucket (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: Explicitly confirm creating or securing the OCI state bucket
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && inputs.confirm_bootstrap == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: oci-staging
    env:
      OCI_REGION: ${{ vars.OCI_REGION || 'us-chicago-1' }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned OCI CLI
        run: python -m pip install --quiet oci-cli==3.96.3
      - name: Fail closed and configure ephemeral OCI credentials
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in OCI_USER OCI_TENANCY OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_COMPARTMENT_OCID OCI_STATE_BUCKET OCI_STATE_NAMESPACE OCI_REGION; do
            [[ -n "${!name}" ]] || { echo "Missing required OCI input: ${name}"; exit 1; }
          done
          [[ "${OCI_STATE_BUCKET}" =~ ^[A-Za-z0-9._-]{3,255}$ ]] || { echo "Invalid state bucket name."; exit 1; }
          [[ "${OCI_REGION}" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid OCI region."; exit 1; }
          install -d -m 0700 "${HOME}/.oci"
          key_path="${RUNNER_TEMP}/oci_api_key.pem"
          printf '%s\n' "${OCI_PRIVATE_KEY}" > "${key_path}"
          chmod 0600 "${key_path}"
          cat > "${HOME}/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER}
          tenancy=${OCI_TENANCY}
          fingerprint=${OCI_FINGERPRINT}
          key_file=${key_path}
          region=${OCI_REGION}
          EOF
          chmod 0600 "${HOME}/.oci/config"
          openssl pkey -in "${key_path}" -check -noout >/dev/null
      - name: Create or secure the versioned private state bucket
        run: |
          set -euo pipefail
          bucket_list="${RUNNER_TEMP}/oci-buckets.json"
          oci os bucket list --compartment-id "${OCI_COMPARTMENT_OCID}" \
            --namespace-name "${OCI_STATE_NAMESPACE}" --all \
            --config-file "${HOME}/.oci/config" --profile DEFAULT > "${bucket_list}"
          if jq -e --arg name "${OCI_STATE_BUCKET}" 'any(.data[]; .name == $name)' "${bucket_list}" >/dev/null; then
            echo "Bucket already exists in the configured compartment; securing its visibility and versioning."
            oci os bucket update --namespace-name "${OCI_STATE_NAMESPACE}" \
              --name "${OCI_STATE_BUCKET}" --versioning Enabled \
              --public-access-type NoPublicAccess \
              --config-file "${HOME}/.oci/config" --profile DEFAULT > "${RUNNER_TEMP}/bucket-update.json"
          else
            echo "Creating a private, versioned state bucket."
            oci os bucket create --namespace-name "${OCI_STATE_NAMESPACE}" \
              --compartment-id "${OCI_COMPARTMENT_OCID}" --name "${OCI_STATE_BUCKET}" \
              --versioning Enabled --public-access-type NoPublicAccess \
              --config-file "${HOME}/.oci/config" --profile DEFAULT > "${RUNNER_TEMP}/bucket-create.json"
          fi
          oci os bucket get --namespace-name "${OCI_STATE_NAMESPACE}" \
            --name "${OCI_STATE_BUCKET}" --config-file "${HOME}/.oci/config" \
            --profile DEFAULT > "${RUNNER_TEMP}/bucket-final.json"
          jq -e '.data.versioning == "Enabled" and .data.public-access-type == "NoPublicAccess"' \
            "${RUNNER_TEMP}/bucket-final.json" >/dev/null
          {
            echo "## OCI Terraform state bucket verified"
            echo
            echo "- Bucket: ${OCI_STATE_BUCKET}"
            echo "- Namespace: ${OCI_STATE_NAMESPACE}"
            echo "- Versioning: Enabled"
            echo "- Public access: NoPublicAccess"
            echo "- Terraform state has not yet been initialized."
          } >> "${GITHUB_STEP_SUMMARY}"
