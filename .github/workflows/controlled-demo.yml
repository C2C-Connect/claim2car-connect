name: Controlled demonstration (synthetic, Gate A evidence)
on:
  pull_request:
  push:
    branches: [main, acceptance, 'acceptance/**', 'release/**', 'rc/**']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture candidate and demo source checksums
        run: |
          mkdir -p output/controlled-demo
          python scripts/candidate_manifest.py capture output/controlled-demo/before.json
          sha256sum app/controlled_demo.py app/review_pipeline.py app/capture_workflow.py app/vin_guard.py contracts/disclosure-v1.json .github/workflows/controlled-demo.yml > output/controlled-demo/sources.sha256
      - name: Run controlled demonstration end-to-end
        run: |
          python -m app.controlled_demo --output output/controlled-demo/run
          test -f output/controlled-demo/run/final_state_reviewed.marker || python - <<'PY'
          import json, pathlib
          files = list(pathlib.Path('output/controlled-demo/run').glob('gate-a-evidence-*.json'))
          assert len(files) == 1, 'exactly one retained evidence record expected'
          record = json.loads(files[0].read_text())
          assert record['final_state'] == 'reviewed'
          assert record['label'] == 'SYNTHETIC-CONTROLLED-DEMO'
          PY
      - name: Verify candidate and demo sources unchanged
        if: always()
        run: |
          python scripts/candidate_manifest.py capture output/controlled-demo/after.json
          python scripts/candidate_manifest.py compare output/controlled-demo/before.json output/controlled-demo/after.json
          sha256sum --check output/controlled-demo/sources.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/controlled-demo/
          if-no-files-found: error
