#cloud-config
# Safe, repeatable host baseline. Persistent volumes are intentionally NOT
# formatted or mounted here; that requires verified OCI volume identity.
package_update: true
package_upgrade: false
packages:
  - podman
  - jq
  - xfsprogs
  - e2fsprogs
  - cryptsetup
  - lvm2
  - util-linux
  - python3
  - python3-pip
  - git
  - curl

write_files:
  - path: /usr/local/sbin/claim2car-staging-deploy
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      fail() { echo "FAIL: $*" >&2; exit 1; }
      [[ $EUID -eq 0 ]] || fail "Must be invoked as root through the restricted OCI Run Command sudo rule."
      [[ $# -eq 6 ]] || fail "Expected commit, app image, script checksum, DB image, registry, and Vault secret OCID."
      commit="$1"; image="$2"; script_sha="$3"; db_image="$4"; registry="$5"; secret_ocid="$6"
      work=""
      cleanup() {
        [[ -z "$work" || ! -d "$work" ]] || rm -rf "$work"
        unset secret_b64 secret_json registry_user registry_token OCI_REGISTRY_TOKEN
      }
      trap cleanup EXIT
      [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || fail "Commit SHA is invalid."
      [[ "$script_sha" =~ ^[a-f0-9]{64}$ ]] || fail "Deploy-script SHA-256 is invalid."
      [[ "$registry" =~ ^[a-z0-9.-]+$ ]] || fail "Registry host is invalid."
      [[ "$image" == "$registry/"* && "$image" =~ :sha-([a-f0-9]{40})@sha256:[a-f0-9]{64}$ ]] || fail "App image must be registry-bound, commit-tagged, and digest-pinned."
      [[ "${BASH_REMATCH[1]}" == "$commit" ]] || fail "App image commit tag does not match requested source commit."
      [[ "$db_image" =~ @sha256:[a-f0-9]{64}$ ]] || fail "Database image must be digest-pinned."
      [[ "$secret_ocid" =~ ^ocid1\.vaultsecret\.[a-zA-Z0-9.]+$ ]] || fail "Vault secret OCID is invalid."
      oci_bin="/opt/oci-cli-venv/bin/oci"
      [[ -x "$oci_bin" ]] || fail "OCI CLI is not installed in the staging venv."
      secret_b64="$("$oci_bin" secrets secret-bundle get --secret-id "$secret_ocid" --auth instance_principal --query 'data."secret-bundle-content".content' --raw-output)" || fail "Instance principal cannot read OCIR Vault secret."
      secret_json="$(printf '%s' "$secret_b64" | base64 --decode)" || fail "Vault secret payload is not valid base64."
      registry_user="$(jq -er '.username | select(type == "string" and length > 0)' <<<"$secret_json")" || fail "Vault OCIR secret has no username."
      registry_token="$(jq -er '.auth_token | select(type == "string" and length > 0)' <<<"$secret_json")" || fail "Vault OCIR secret has no auth_token."
      unset secret_b64 secret_json
      work="$(mktemp -d /run/claim2car-deploy.XXXXXX)"
      script_url="https://raw.githubusercontent.com/C2C-Connect/claim2car-connect/$commit/scripts/oci_staging_runtime_deploy.sh"
      curl --fail --silent --show-error --location --retry 3 "$script_url" -o "$work/deploy.sh" || fail "Unable to retrieve source-pinned deployment helper."
      printf '%s  %s\n' "$script_sha" "$work/deploy.sh" | sha256sum --check --status || fail "Deployment helper checksum mismatch."
      chmod 0700 "$work/deploy.sh"
      export OCI_REGISTRY="$registry" OCI_REGISTRY_USERNAME="$registry_user" OCI_REGISTRY_TOKEN="$registry_token"
      export OCI_IMAGE_REF="$image" C2C_POSTGRES_IMAGE="$db_image"
      unset registry_user
      bash "$work/deploy.sh"
      unset OCI_REGISTRY_TOKEN
      echo "PASS: private Run Command deployment completed using source-pinned script and Vault-fed OCIR credentials."
  - path: /etc/sudoers.d/101-claim2car-runcommand
    owner: root:root
    permissions: '0440'
    content: |
      ocarun ALL=(root) NOPASSWD: /usr/local/sbin/claim2car-staging-deploy
  - path: /etc/oracle-cloud-agent/plugins/runcommand/config.yml
    owner: root:root
    permissions: '0644'
    content: |
      logDir: /var/log/oracle-cloud-agent/plugins/runcommand
      commandExecutionMaxWorkers: 2
  - path: /usr/local/sbin/claim2car-host-preflight
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      fail() { echo "FAIL: $*" >&2; exit 1; }
      command -v podman >/dev/null || fail "podman is not installed"
      command -v findmnt >/dev/null || fail "findmnt is not installed"
      command -v runuser >/dev/null || fail "runuser is not installed"
      command -v python3 >/dev/null || fail "python3 is not installed"
      [[ -x /opt/oci-cli-venv/bin/oci ]] || fail "OCI CLI virtualenv is not installed"
      [[ -x /usr/local/sbin/claim2car-staging-deploy ]] || fail "private deployment wrapper is missing"
      getent passwd ocarun >/dev/null || fail "OCI Run Command ocarun account is missing"
      visudo -cf /etc/sudoers.d/101-claim2car-runcommand >/dev/null || fail "restricted Run Command sudo rule is invalid"
      getent passwd 10001 >/dev/null || fail "claim2car UID 10001 is missing"

      postgres_path="/var/lib/claim2car/postgres"
      evidence_path="/var/lib/claim2car/evidence"
      postgres_source=""
      evidence_source=""

      for path in "$postgres_path" "$evidence_path"; do
        [[ -d "$path" && ! -L "$path" ]] || fail "storage path missing or symlinked: $path"
        source="$(findmnt -rn -o SOURCE --mountpoint "$path")" || fail "persistent volume is not mounted at $path"
        [[ -n "$source" ]] || fail "persistent volume source is empty: $path"
        [[ "$(stat -c %u:%g "$path")" == "10001:10001" ]] || fail "storage path must be owned by UID/GID 10001: $path"
        expected_mode="750"
        [[ "$path" == "$evidence_path" ]] && expected_mode="700"
        [[ "$(stat -c %a "$path")" == "$expected_mode" ]] || fail "storage path mode must be $expected_mode: $path"

        # Exercise the actual application identity and durable filesystem operations.
        runuser -u 10001 -- python3 - "$path" <<'PY'
      import os
      import sys
      import tempfile

      root = sys.argv[1]
      fd, probe = tempfile.mkstemp(prefix=".claim2car-storage-preflight-", dir=root)
      directory_fd = None
      try:
          os.write(fd, b"claim2car-storage-preflight")
          os.fsync(fd)
          os.close(fd)
          fd = -1
          directory_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
          os.unlink(probe)
          os.fsync(directory_fd)
      finally:
          if fd >= 0:
              os.close(fd)
          if os.path.exists(probe):
              os.unlink(probe)
          if directory_fd is not None:
              os.close(directory_fd)
      PY

        if [[ "$path" == "$postgres_path" ]]; then
          postgres_source="$source"
        else
          evidence_source="$source"
        fi
      done

      [[ "$postgres_source" != "$evidence_source" ]] || fail "PostgreSQL and evidence paths resolve to the same mounted source"
      echo "PASS: private host runtime, distinct persistent volumes, UID 10001 access, and write/fsync/remove probes"
      
runcmd:
  - [bash, -lc, "python3 -m venv /opt/oci-cli-venv"]
  - [bash, -lc, "/opt/oci-cli-venv/bin/pip install --no-cache-dir oci-cli==3.96.3"]
  - [bash, -lc, "visudo -cf /etc/sudoers.d/101-claim2car-runcommand"]
  - [bash, -lc, "getent group 10001 >/dev/null || groupadd --gid 10001 claim2car"]
  - [bash, -lc, "getent passwd 10001 >/dev/null || useradd --uid 10001 --gid 10001 --system --no-create-home --home-dir /var/lib/claim2car --shell /usr/sbin/nologin claim2car"]
  - [bash, -lc, "install -d -o 10001 -g 10001 -m 0750 /var/lib/claim2car /var/lib/claim2car/postgres /var/lib/claim2car/evidence"]
  - [bash, -lc, "install -d -o root -g root -m 0750 /opt/claim2car /etc/claim2car"]
  - [bash, -lc, "systemctl enable podman.socket"]
