<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Claim2Car IndexedDB Queue Test</title>
</head>
<body>
  <main>
    <h1>Claim2Car IndexedDB queue integration harness</h1>
    <p>This page uses synthetic byte fixtures only.</p>
    <output id="status">Initializing</output>
  </main>
  <script type="module">
    import {
      createIndexedDbEvidenceStore,
      createOfflineEvidenceQueue,
    } from "../../../app/web/assets/offline_evidence_queue.mjs";

    const sessionId = "browser-test-session";
    const tenantId = "browser-test-tenant";
    const actorId = "browser-test-actor";
    const keyMaterial = "browser-test-operator-token-material-0123456789ABCDEF";
    const store = createIndexedDbEvidenceStore();
    const queueStore = store;
    const queue = createOfflineEvidenceQueue({store});

    window.c2cQueueHarness = Object.freeze({
      async reset() {
        const request = indexedDB.deleteDatabase("claim2car-evidence");
        await new Promise((resolve, reject) => {
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error("TEST_DATABASE_DELETE_FAILED"));
          request.onblocked = () => reject(new Error("TEST_DATABASE_DELETE_BLOCKED"));
        });
        return true;
      },
      async seed() {
        const first = await queue.queueFile({
          sessionId, tenantId, actorId, slot:"front",keyMaterial,
          file:new File(["synthetic-original-front"],"front.jpg",{type:"image/jpeg"}),
        });
        const second = await queue.queueFile({
          sessionId, tenantId, actorId, slot:"rear",keyMaterial,
          file:new File(["synthetic-original-rear"],"rear.jpg",{type:"image/jpeg"}),
        });
        return [first.queueId,second.queueId];
      },
      async status(forActor = actorId, forTenant = tenantId) {
        return queue.status(sessionId,{tenantId:forTenant,actorId:forActor});
      },
      async sync(failFirst = false, token = keyMaterial) {
        const attempted = [];
        const result = await queue.syncSession({
          sessionId,tenantId,actorId,keyMaterial:token,
          upload:async (record) => {
            attempted.push({
              queueId:record.queueId,
              artifactId:record.artifactId,
              requestId:record.requestId,
              byteLength:record.bytes.byteLength,
            });
            if (failFirst) throw new Error("SYNTHETIC_NETWORK_INTERRUPTION");
            return {ok:true};
          },
        });
        return {result,attempted};
      },
      async addOtherActor() {
        return queue.queueFile({
          sessionId,tenantId,actorId:"browser-test-other-actor",slot:"front",keyMaterial,
          file:new File(["other-actor-original"],"other.jpg",{type:"image/jpeg"}),
        });
      },
      async raw(){return queueStore.list(sessionId,{tenantId,actorId,includeBytes:true});},
      async purge() {
        return queue.deleteSession(sessionId,{tenantId});
      },
    });
    document.getElementById("status").textContent = "Ready";
  </script>

    <script type="module">
      import {
        createIndexedDbEvidenceStore,
        createOfflineEvidenceQueue,
      } from "../../../frontend/app/offline_evidence_queue.mjs";
      const sessionId="integrated-browser-test-session",tenantId="integrated-browser-test-tenant",actorId="integrated-browser-test-actor";
      const store=createIndexedDbEvidenceStore();
      const queue=createOfflineEvidenceQueue({store});
      const keyMaterial="integrated-browser-test-operator-token-material-0123456789ABCDEF";
      window.c2cIntegratedQueueHarness=Object.freeze({
        async reset(){
          const request=indexedDB.deleteDatabase("claim2car-integrated-evidence");
          await new Promise((resolve,reject)=>{request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error||new Error("TEST_DATABASE_DELETE_FAILED"));request.onblocked=()=>reject(new Error("TEST_DATABASE_DELETE_BLOCKED"));});
          return true;
        },
        async seed(){
          const a=await queue.queueFile({sessionId,tenantId,actorId,slot:"00_front_exterior",file:new File(["integrated-original-front"],"front.jpg",{type:"image/jpeg"}),keyMaterial});
          const b=await queue.queueFile({sessionId,tenantId,actorId,slot:"01_front_right_exterior",file:new File(["integrated-original-corner"],"corner.jpg",{type:"image/jpeg"}),keyMaterial});
          return [a.queueId,b.queueId];
        },
        async status(forActor=actorId){return queue.status(sessionId,{tenantId,actorId:forActor});},
        async sync(failFirst=false,token=keyMaterial){
          const attempted=[];
          const result=await queue.syncSession({sessionId,tenantId,actorId,keyMaterial:token,upload:async record=>{
            attempted.push({queueId:record.queueId,artifactId:record.artifactId,requestId:record.requestId,bytes:new TextDecoder().decode(record.bytes)});
            if(failFirst)throw new Error("SYNTHETIC_NETWORK_INTERRUPTION");
            return {ok:true};
          }});
          return {result,attempted};
        },
        async purge(){return queue.deleteSession(sessionId,{tenantId});}
      });
    </script>
\n</body>
