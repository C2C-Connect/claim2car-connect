<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Command Center</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1a1a1a; }
    header { background: #0f172a; color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 600; letter-spacing: 0.04em; }
    main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 0.25rem; font-size: 1.8rem; }
    .sub { color: #666; margin-bottom: 1.5rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: #fff; border-radius: 8px; padding: 1rem 1.25rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .stat .label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: #888; }
    .stat .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.25rem; }
    .live { display: inline-block; background: #10b981; color: #fff; font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 999px; margin-left: 0.4rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">CLAIM2CAR / COMMAND</div>
    <div>Admin</div>
  </header>
  <main>
    <h1>Welcome back.</h1>
    <div class="sub">Real-time control surface across routing, settlement, and reconstruction.</div>
    <div class="stats" id="stats"></div>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get("token") || localStorage.getItem("faos_token");
    async function load() {
      if (!token) return;
      const res = await fetch("/admin/dashboard", { headers: { Authorization: "Bearer " + token } });
      const d = await res.json();
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="label">Claims <span class="live">LIVE</span></div><div class="value">${d.claims_today}</div></div>
        <div class="stat"><div class="label">Routed</div><div class="value">${d.routed}</div></div>
        <div class="stat"><div class="label">Human Review</div><div class="value">${d.human_review}</div></div>
        <div class="stat"><div class="label">Settled</div><div class="value">${d.settled}</div></div>
        <div class="stat"><div class="label">Operator Payout</div><div class="value">$${(d.operator_payout_cents/100).toFixed(2)}</div></div>
        <div class="stat"><div class="label">Dealer Invoice</div><div class="value">$${(d.dealer_invoice_cents/100).toFixed(2)}</div></div>`;
    }
    const a = await fetch("/admin/activity", { headers: { Authorization: "Bearer " + token } });
      const feed = await a.json();
      const el = document.createElement("div");
      el.style.marginTop = "2rem";
      el.innerHTML = "<h3>Live Activity</h3>" + (feed.events || []).map(e => `<div style="padding:.3rem 0;border-bottom:1px solid #eee">${e.session_id.slice(0,8)} · ${e.status}</div>`).join("");
      document.querySelector("main").appendChild(el);
    if (token) load();
  </script>
</body>
</html>
